# Config-as-code for the CEO's Enterprise fleet. Single source of truth for
# reliability thresholds, SLOs, and alert routing. Scripts and CI read this file
# instead of hard-coding values, so operational policy lives in version control
# and changes go through review.

service: ceos-enterprise
owner: charles
environment: production

# Service Level Objectives — what "reliable" means, measurably.
slos:
  availability:
    target: 99.5          # % of successful /api/health probes over 30d
    window_days: 30
  latency:
    p95_budget_ms: 2000   # health endpoint p95 must stay under this
  fleet_freshness:
    target: 99.0          # % of checks where all agents are fresh

# Per-agent cadence now lives in code, in lib/agents.ts (mode / cadenceMinutes /
# graceMinutes), so the health route and dashboard share one source of truth:
#   scheduled  → overdue if now - last_run > cadenceMinutes + graceMinutes
#   on-demand  → never "overdue"; shown idle/ready, triggered via the run endpoint
#   continuous → overdue past a short grace
# This block documents the intent; edit the actual values in lib/agents.ts.
fleet_model:
  scheduled:  [commerce, finance, lambos-trader, growth, social, school]
  on_demand:  [jobs, hobbies]

# Automated remediation consumed by scripts/runbook-restart-stale.mjs. Only
# scheduled/continuous agents can be "overdue", so on-demand agents are never
# auto-triggered by the runbook.
remediation:
  overdue_agent:
    action: retrigger      # POST /api/agents/{agent}/run (x-report-secret) → enqueues a run request
    max_retries: 2
    cooldown_minutes: 20
    escalate_after: 2      # page a human after N failed auto-remediations

# Alert routing.
alerts:
  channel: discord
  webhook_env: ALERT_WEBHOOK_URL
  severities:
    page:  [unreachable, db_down]
    warn:  [overdue_agent, latency_breach]
